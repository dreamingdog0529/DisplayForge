name: Dependency Review

on:
  pull_request:
    branches: [main, master]

# Requires Dependency graph (Settings → Code security).
# Public repos: enable Dependency graph if this job 404s with GITHUB_TOKEN.
permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # License enforcement is handled by license-check.yml (nuget-license),
          # the authoritative gate for this project's NuGet dependencies.
          # The deny-licenses option is deprecated upstream (actions/dependency-review-action#997).
